{{- /* 이미지 = registry(values-env) / image.name(module.yaml) + digest(prod) | tag(local) */ -}}
{{- $tagref := printf ":%s" (.Values.imageTag | default "latest") -}}
{{- if .Values.imageDigest }}{{ $tagref = printf "@%s" .Values.imageDigest }}{{ end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.registry }}/{{ .Values.spec.image.name }}{{ $tagref }}"
          {{- if .Values.imageDigest }}{{- else }}
          imagePullPolicy: Never   {{- /* 로컬 tag 는 pull 안 함 */}}
          {{- end }}
          ports:
            {{- range .Values.spec.routing }}
            - containerPort: {{ .port }}
            {{- end }}
          {{- if .Values.spec.secrets }}
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-secrets
          {{- end }}
