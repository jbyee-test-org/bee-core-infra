{{- /* events.consumes → NACK durable Consumer (구독자 = 모듈명 durable). */ -}}
{{- with .Values.spec.events }}
{{- range .consumes }}
apiVersion: jetstream.nats.io/v1beta2
kind: Consumer
metadata:
  name: {{ $.Release.Name }}-{{ .stream | lower | replace "_" "-" }}   {{- /* k8s 이름 새니타이즈(언더스코어 불가). streamName 은 원본 */}}
  namespace: {{ include "bee.namespace" $ }}
spec:
  streamName: {{ .stream }}
  durableName: {{ $.Release.Name }}
  filterSubject: {{ .subject | quote }}
  deliverPolicy: all
  ackPolicy: explicit
---
{{- end }}
{{- end }}
