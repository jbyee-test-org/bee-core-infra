# dev 공유환경 Application — 스냅샷이 SoT, ArgoCD 가 유일한 적용자(G5·G7).
# 소스 = bee-snapshot/envs/dev (Rendered Manifests Pattern). module.yaml·provenance.yaml·
# contracts/ 는 k8s 리소스가 아니므로 제외 — 메타·계약은 bee CLI·게이트가 소비한다(G9·bee contracts).
# (db/ 는 .sql 이라 ArgoCD directory 가 자동 무시 · contracts/*.yaml 은 YAML 이라 명시 제외 필수.)
#
# 알려진 단순화(Phase 3 과제): 렌더에 metadata.namespace 가 없어 destination.namespace 로
# 일괄 배치 — 다제품(product→ns 다중) 시 chart 가 namespace 를 렌더하도록 확장 필요.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bee-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jbyee-test-org/bee-snapshot
    targetRevision: main
    path: envs/dev
    directory:
      recurse: true
      exclude: "{**/module.yaml,**/provenance.yaml,**/contracts/**}"
  destination:
    server: https://kubernetes.default.svc
    namespace: bitcert-attest
  # **manual sync 포스처(G53)** — automated 없음. `bee sync dev` 가 *유일한 배포 트리거*(= 배포 게이트):
  #   snap(스냅샷 SoT 쓰기) ⊥ sync(ArgoCD 반영)가 실효 — push 됐다고 자동 배포 아님(규칙 8 명시 갱신 정신).
  #   prune/selfHeal 은 `bee sync` 의 operation.sync.prune 으로 명시 수행(기본 on, --no-prune 로 끔).
  #   (구 automated.prune+selfHeal → 명시 동사로 이전. 자동 폴링 배포 폐기.)
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
