# dev substrate Application — substrate 의 SoT 는 core-infra(선언 데이터, G12③).
# 렌더 산출물이 아니므로 snapshot 이 아니라 core-infra 를 직접 watch 한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bee-substrate-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jbyee-test-org/bee-core-infra
    targetRevision: main
    path: substrate
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # 도입 사유=NACK CRD client-side 한도(G42 에서 NACK 제거); 옵션은 무해·유지(재적용 안전)
