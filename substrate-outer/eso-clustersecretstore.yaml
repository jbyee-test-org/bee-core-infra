# 아웃터 시크릿 경로(G27) — ESO ClusterSecretStore (데모 fake provider).
# 슬라이스 spec.secrets 가 dev 에서 ExternalSecret 으로 렌더 → 이 store 가 충족.
# remoteRef.key = asmPrefix/<env>/<module>/<group>(values-dev 좌표), property = BITCERT_*.
# fake.data[].value = 그 group 의 properties JSON(property 추출은 ESO gjson). version 생략(remoteRef 무버전).
#
# **outer-only** — 인너루프는 ESO 없이 bee 가 secrets.local.yaml 을 직접 apply(G27). 그래서 shared
# substrate/(인너도 적용)에 두지 않고 여기(substrate-outer/)에 분리. ESO operator 는 수동 helm
# 릴리스(external-secrets, like Kong G26 — 아웃터 ArgoCD화는 후속). 값=데모 자격증명(substrate 와 동급).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bee-demo-store
spec:
  provider:
    fake:
      data:
        # ── ingestion ──
        - key: bitcert/dev/ingestion/db
          value: '{"BITCERT_DATABASE_URL":"postgres://bee:bee-demo@postgres.bee-substrate.svc.cluster.local:5432/bee"}'
        - key: bitcert/dev/ingestion/nats
          value: '{"BITCERT_NATS_URL":"nats://nats.bee-substrate.svc.cluster.local:4222"}'
        - key: bitcert/dev/ingestion/dev
          value: '{"BITCERT_DEV_EXCHANGE_ID":"00000000-0000-0000-0000-000000000001","BITCERT_DEV_AUDIT_FIRM_ID":"00000000-0000-0000-0000-000000000002"}'
        - key: bitcert/dev/ingestion/net
          value: '{"BITCERT_PORT":"3008"}'
        # ── batching ──
        - key: bitcert/dev/batching/db
          value: '{"BITCERT_DATABASE_URL":"postgres://bee:bee-demo@postgres.bee-substrate.svc.cluster.local:5432/bee"}'
        - key: bitcert/dev/batching/nats
          value: '{"BITCERT_NATS_URL":"nats://nats.bee-substrate.svc.cluster.local:4222","BITCERT_NATS_STREAM":"ANN_BITCERT_ATTEST_EVENTS"}'
        - key: bitcert/dev/batching/net
          value: '{"BITCERT_PORT":"3010"}'
        # ── anchoring ──
        - key: bitcert/dev/anchoring/db
          value: '{"BITCERT_DATABASE_URL":"postgres://bee:bee-demo@postgres.bee-substrate.svc.cluster.local:5432/bee"}'
        - key: bitcert/dev/anchoring/nats
          value: '{"BITCERT_NATS_URL":"nats://nats.bee-substrate.svc.cluster.local:4222","BITCERT_NATS_STREAM":"ANN_BITCERT_ATTEST_EVENTS"}'
        - key: bitcert/dev/anchoring/net
          value: '{"BITCERT_PORT":"3009"}'
        - key: bitcert/dev/anchoring/bitcoin
          value: '{"BITCERT_BITCOIND_RPC_URL":"http://bitcoind.bee-substrate.svc.cluster.local:18443","BITCERT_BITCOIND_RPC_USER":"bee","BITCERT_BITCOIND_RPC_PASSWORD":"bee-demo"}'
