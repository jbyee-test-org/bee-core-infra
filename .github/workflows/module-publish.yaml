# 모듈 publish 재사용 워크플로 (workflow_call) — 모듈 레포는 얇은 caller 만 가진다(G5).
# 흐름: digest 결정 → bee publish headless(렌더+엔트리+커밋, G5) →
#       게이트1(kubeconform+conftest — 차단은 여기, 규칙 2) → 통과 시에만 snapshot push.
# **빌드는 로컬 단일 모델(G33)** — CI 는 빌더가 아니라 퍼블리셔(빌드=`bee build --push`, 사설 registry
#   토큰 미접촉). digest 결정 2-way: image 모듈 = 사전빌드 digest **필수**(없으면 에러 — CI 빌드 없음) ·
#   image-less(workload 없는 schema 모듈, G21) = digest 없이 publish.
# 보안: 모든 보간은 env 경유(인젝션 안전 패턴) — run 블록에 ${{ }} 직접 사용 금지.
name: module-publish
on:
  workflow_call:
    inputs:
      module: { required: true, type: string }
      env: { required: false, type: string, default: dev }
      digest: { required: false, type: string, default: "" }   # 사전빌드 이미지 digest(C) — 있으면 CI 빌드 생략
    secrets:
      SNAPSHOT_KEY: { required: true }   # bee-snapshot 쓰기 자격증명 (deploy key)

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      MODULE: ${{ inputs.module }}
      TARGET_ENV: ${{ inputs.env }}
      INPUT_DIGEST: ${{ inputs.digest }}
      OWNER: ${{ github.repository_owner }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # crane ghcr 인증(digest 존재 게이트, G53) — private 이미지 read
    steps:
      - name: 모듈 체크아웃
        uses: actions/checkout@v4
        with: { path: module }

      - name: 이미지 digest 결정 (image 모듈 = 사전빌드 digest 필수[로컬 C] · image-less = 없음[G21])
        id: img
        run: |
          if [ -n "$INPUT_DIGEST" ]; then
            # image 모듈 — 로컬 `bee build -e <env> --push` 가 산출한 digest(빌더 책임, G30/G33).
            echo "사전빌드 digest 사용(C): $INPUT_DIGEST"
            DIGEST="$INPUT_DIGEST"
          elif [ -f module/Dockerfile ]; then
            # image 모듈인데 digest 미입력 — CI 빌드 없음(G33). 로컬 빌드 후 digest 로 dispatch 해야 함.
            echo "::error::image 모듈($MODULE)에 digest 없음 — 빌드는 로컬(G33): bee build -e $TARGET_ENV --push → digest → workflow_dispatch(-f digest=...)"
            exit 1
          else
            # image-less(workload 없는 schema 모듈, G21) — digest 없이 publish(Deployment 미렌더).
            echo "image-less 모듈($MODULE) — digest 없음(workload 없음, G21)"
            DIGEST=""
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: core-infra 체크아웃 (게이트1 정책·platform.yaml — chart 는 OCI 소비로 전환, G6)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/bee-core-infra
          path: core-infra

      - name: snapshot 체크아웃 (쓰기 자격증명)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/bee-snapshot
          path: snapshot
          ssh-key: ${{ secrets.SNAPSHOT_KEY }}

      - name: bee 설치 (uv tool)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" tool install "git+https://github.com/$OWNER/bee-cli"

      - name: headless 워크스페이스 구성
        # chart 소비 = OCI(G6 완성). chart 패키지는 public(익명 read)이라 모듈 레포 CI 의
        # GITHUB_TOKEN 으로도 helm pull 가능 — core-infra 경로는 게이트1(정책·platform)용으로만 유지.
        # 전제: ghcr 패키지 charts/bee-module 가시성 = public (private 면 helm pull 403).
        run: |
          cat > bee.workspace.yaml <<EOF
          version: 1
          snapshot: { repo: snapshot, env: $TARGET_ENV, ref: main }
          coreInfra: { path: core-infra, platform: bitcert, chartRef: "oci://ghcr.io/$OWNER/charts/bee-module" }
          imageRegistry: ghcr.io/$OWNER/bitcert
          local:
            $MODULE: { path: module }
          EOF

      - name: bee publish (렌더 + 엔트리 + 커밋 — push 는 게이트1 뒤)
        env:
          DIGEST: ${{ steps.img.outputs.digest }}
        run: |
          git config --global user.name "bee-ci"
          git config --global user.email "bee-ci@users.noreply.github.com"
          # image-less(G21)는 digest 없이 — Deployment 미렌더라 digest pin 불요.
          # snap -e <env> (G52 — 구 publish): dev=사다리 맨앞이라 --digest 빌드 핀.
          if [ -n "$DIGEST" ]; then
            bee snap -e "$TARGET_ENV" "$MODULE" --digest "$DIGEST"
          else
            bee snap -e "$TARGET_ENV" "$MODULE"
          fi

      - name: 게이트1 (kubeconform + conftest + crane digest 존재)
        run: |
          curl -sLo /tmp/kc.tgz https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -C /tmp -xzf /tmp/kc.tgz kubeconform && sudo mv /tmp/kubeconform /usr/local/bin/
          CT_URL=$(curl -s https://api.github.com/repos/open-policy-agent/conftest/releases/latest | grep -o 'https://[^"]*Linux_x86_64.tar.gz' | head -1)
          curl -sLo /tmp/ct.tgz "$CT_URL" && tar -C /tmp -xzf /tmp/ct.tgz conftest && sudo mv /tmp/conftest /usr/local/bin/
          # crane — digest 존재 게이트(G53, phantom pin 방어). ghcr 인증(private 슬라이스 이미지 read).
          # 인증 username 은 임의(토큰 auth) — OWNER 재사용(github.actor 미사용, 인젝션 표면 0).
          CR_URL=$(curl -s https://api.github.com/repos/google/go-containerregistry/releases/latest | grep -o 'https://[^"]*go-containerregistry_Linux_x86_64.tar.gz' | head -1)
          curl -sLo /tmp/cr.tgz "$CR_URL" && tar -C /tmp -xzf /tmp/cr.tgz crane && sudo mv /tmp/crane /usr/local/bin/
          printf '%s' "$GH_TOKEN" | crane auth login ghcr.io -u "$OWNER" --password-stdin
          # 게이트 스코프 = 이번에 publish 된 모듈 엔트리만 — 남의 구 엔트리로 내 CI 가
          # 죽으면 모듈 단위 bump 스윕이 불가능(닭-달걀). env 전반 정합은 별도 관심사.
          bash core-infra/ci/gate1.sh "snapshot/envs/$TARGET_ENV/$MODULE"

      - name: snapshot push (게이트1 통과 시에만 — 동시 publish 레이스는 rebase 재시도)
        run: |
          for i in 1 2 3; do
            git -C snapshot push && exit 0
            git -C snapshot pull --rebase
          done
          git -C snapshot push
