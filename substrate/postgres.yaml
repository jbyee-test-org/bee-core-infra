# postgres — db/grant 어휘(Phase 3b)의 기반. 데모 고정 자격증명(실환경은 ESO — 구 D13).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-demo
  namespace: bee-substrate
type: Opaque
stringData:
  POSTGRES_USER: bee
  POSTGRES_PASSWORD: bee-demo   # 데모 전용 — 공유환경 실값은 ESO+ASM
  POSTGRES_DB: bee
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: bee-substrate
  labels: { app.kubernetes.io/name: postgres }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef: { name: postgres-demo }
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: bee-substrate
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - { port: 5432, targetPort: 5432 }
