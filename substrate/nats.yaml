# NATS + JetStream(`-js`) — 접속형 메시징 substrate(G41·G42). 모듈은 natsUrl 좌표로 연결해
# 런타임에 publish/subscribe 하고, 필요한 stream 은 발행 앱이 JetStream API 로 직접 소유
# (get_or_create_stream). events 어휘·NACK(CR 브리지)는 G42 에서 제거 — bee 는 stream 에 무관여.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: bee-substrate
  labels: { app.kubernetes.io/name: nats }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: nats }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nats }
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          args: ["-js", "-m", "8222"]
          ports:
            - containerPort: 4222
            - containerPort: 8222
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: bee-substrate
spec:
  selector: { app.kubernetes.io/name: nats }
  ports:
    - { name: client, port: 4222, targetPort: 4222 }
    - { name: monitor, port: 8222, targetPort: 8222 }
