# mysql — db 코덱(G44) **mysql target 의 라이브 기반**(G45). postgres.yaml 와 동형(Secret+PVC+Deployment Recreate+Service).
# platform provides.db 의 {target: mysql} 선언을 실제로 뒷받침 — render-proven(mysql-probe) → **live-proven** 으로 승격.
# 데모 고정 자격증명(실환경은 ESO). MYSQL_ROOT_HOST=% → root 가 TCP(다른 pod)로 접속 가능 +
# 전역 권한(CREATE USER·GRANT) 보유 → flyway 가 마이그레이션+grants 코덱(CREATE USER/GRANT ON db.*)을 실행.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-demo
  namespace: bee-substrate
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: bee-demo   # 데모 전용 — 공유환경 실값은 ESO+ASM
  MYSQL_ROOT_HOST: "%"            # root@'%' — pod 간 TCP 접속 허용(데모). 실환경은 최소권한 유저+ESO
  MYSQL_DATABASE: probe           # mysql-probe 의 database(= mysql 의 schema)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: bee-substrate
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: bee-substrate
  labels: { app.kubernetes.io/name: mysql }
spec:
  replicas: 1
  strategy: { type: Recreate }   # PVC RWO — 롤링 시 두 pod 가 같은 볼륨 못 붙음(postgres 와 동일)
  selector:
    matchLabels: { app.kubernetes.io/name: mysql }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mysql }
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          envFrom:
            - secretRef: { name: mysql-demo }
          ports:
            - containerPort: 3306
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: mysql-data }
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: bee-substrate
spec:
  selector: { app.kubernetes.io/name: mysql }
  ports:
    - { port: 3306, targetPort: 3306 }
