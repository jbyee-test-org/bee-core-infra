# __MODULE__ 모듈 — **논리만** (origin-free, 규칙 4). 좌표는 values-<env> 에.
metadata:
  name: __MODULE__
spec:
  product: attest               # platform.yaml products 의 키 — 배치 namespace 가 정해진다
  chart:
    version: "0.3.0"            # bee-module pin (G6) — starter 는 chart 와 공동 버전(G5)
  image:
    name: __MODULE__
  dependsOn: []
  routing:
    - { path: /__MODULE__/v1, port: 8080 }
  # events: { publishes: [...], consumes: [...] }   # 어휘는 필요 시 (G12②)
