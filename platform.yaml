# bitcert 플랫폼 디스크립터 — **정책 + 배치 데이터**, 좌표 파생 없음.
#
# GENESIS 세계의 platform.yaml 은 슬림하다: 좌표(registry·ASM·domain)는 모듈의
# values-<env> 가 직접 가진다(규칙 3, 수직분할 — prototype 실증). 여기 남는 것은
# ① chart 지원 범위 정책(G6 — pin 아님, CI lint·CLI 경고의 입력)
# ② products → namespace 맵(파생이 아니라 배치 데이터 — CLI 의 "어디에" + orient 표시)
# ③ env 목록.
# POC 의 중앙 좌표 모델(D22: registry/secrets/ingress/snapshotRepo)은 캐리하지 않음.
# ④ substrate.provides(G36) — 플랫폼 substrate 가 *제공*하는 capability. uses(모듈 논리 어휘에서 파생)
#    와 정합해야(doctor/CI 검증). G28 ②(uses/provides) 의 provides-side·검증을 1급화하되, 멀티-provider
#    코덱/렌더(③)는 2nd-provider 압력까지 연기. 선언+검증이지 프로비저닝 아님(provider 적용=substrate up, G26).
apiVersion: bee-platform/v1
kind: Platform
metadata:
  name: bitcert
spec:
  chart:
    supported: ">=0.2.0 <0.6.0"   # 0.5.0 additive(G21 schema 모듈) — widen(G13·G14·G18·G21)
  envs: [dev, prod]   # G51 — staging 제거. 인너루프는 env 아님(SoT 밖, 규칙 7). 중간단은 additive(압력 시 dir 추가)
  products:
    shell: { namespace: ann-platform }      # 공통 셸 제품군 (구 제품명 — 도구 개명과 무관, G4)
    attest: { namespace: bitcert-attest }   # bitcert-attest 제품 (ingestion/batching/…)
  substrate:                                 # ⚠ G42 편집이 이 부모 줄을 떨어뜨려 provides 가 products 밑에 잘못 박혔던 것을
                                             #   G44 fail-fast 가 적발 → 복구. provides 거처 = spec.substrate.provides(bee 가 여기서 읽음).
    provides:                                # capability → provider(바인딩 기록).
                                             # G41 분류: 주입형(declare-into)=어휘+codec earned · 접속형(connect-to)=좌표만·1급화 X.
                                             # provides 는 두 종류 다 담되, 1급 어휘(module spec)는 주입형만.
      db:                                    # 주입형 — 어휘 db{target,schema,migrations,grants} + chart 코덱(G14·G18·G44).
                                             #   리스트 = 지원 target. 모듈이 spec.db.target 으로 *선택*(provider 코덱 dispatch).
                                             #   jdbcPrefix·port = 접속 좌표 데이터(규칙 3 — 차트가 치환, 분기 아님).
        - { target: psql,  provider: postgres, jdbcPrefix: "jdbc:postgresql", port: 5432 }
        - { target: mysql, provider: mysql,    jdbcPrefix: "jdbc:mysql",      port: 3306, jdbcParams: "useSSL=false&allowPublicKeyRetrieval=true" }   # 데모 — mysql8 caching_sha2 over plaintext(실환경=TLS)
      routing: { provider: kong }            # 주입형 — 어휘 routing + provider-rendering 코덱(G40, kong↔nginx)
      events:  { provider: nats }            # 접속형(G41·G42) — natsUrl 좌표로 런타임 publish/subscribe.
                                             #   stream 은 발행 앱이 소유(get_or_create_stream). 어휘·codec·NACK 없음.
      btc:     { provider: bitcoind }        # 접속형(G41) — RPC 좌표로 use. 명시 uses 어휘 없음(G36 의 btc uses 는 G41 로 철회).
  # ⑤ resources(G37) — 리소스 프로파일(논리명 + default 구체). 모듈은 `spec.uses` 로 *논리 참조*(origin-free,
  #    규칙 4) → chart 가 룩업·렌더(rule 1). env 미세조정은 values-<env>.resources override(규칙 3 — env差=values).
  #    선언+렌더이지 프로비저닝 아님(StorageClass 가 볼륨 프로비전, G26). compute=클러스터 용량 · storage=PV.
  resources:
    compute:
      small:  { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
      medium: { requests: { cpu: 250m, memory: 256Mi }, limits: { cpu: "1",  memory: 1Gi } }
    storage:
      persistent: { storageClass: standard, size: 1Gi }   # kind 기본 SC=standard · 실: gp3 등(values override)
